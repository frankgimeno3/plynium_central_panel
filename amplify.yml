version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules
        - npm ci --include=optional
        - npm install @tailwindcss/oxide-linux-x64-gnu --save-optional
    build:
      commands:
        - nvm use 20
        - export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=6144"
        - |
          set -e
          echo "=== Build env check (names only) ==="
          for v in DATABASE_HOST DATABASE_NAME DATABASE_USER DATABASE_PASSWORD DATABASE_PORT IAM_ACCESS_KEY_ID IAM_SECRET_ACCESS_KEY IAM_REGION S3_BUCKET CLOUDFRONT_URL; do
            if [ -n "${!v}" ]; then echo "  OK  $v"; else echo "  MISS $v"; fi
          done

          if [ -z "$DATABASE_HOST" ]; then
            echo "ERROR: DATABASE_HOST is not set in Amplify → Environment variables (branch main)."
            exit 1
          fi

          rm -f .env.production
          env | grep -E '^DATABASE_' >> .env.production || true
          env | grep -E '^IAM_' >> .env.production || true
          env | grep -E '^S3_BUCKET=' >> .env.production || true
          env | grep -E '^CLOUDFRONT_URL=' >> .env.production || true
          env | grep -E '^NEXT_PUBLIC_' >> .env.production || true

          echo "Wrote .env.production ($(wc -l < .env.production) lines)"
          grep -E '^DATABASE_(HOST|NAME|PORT)=' .env.production || true
        - npm run build:amplify
        - cp .env.production .next/.env.production
        - test -f .next/.env.production && echo "OK .next/.env.production shipped with artifact"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*